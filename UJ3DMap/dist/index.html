<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Offline Map & Router for the University of Jos" />
    <title>UJ3DMap - University of Jos</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    
    <script type="module" crossorigin src="/assets/index-CbcPlBQW.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CvXUTNlc.css">
  <link rel="manifest" href="/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>
  <body>
    <div id="app-container" style="display: flex; height: 100vh; width: 100vw; overflow: hidden; position: relative;">
      
      <!-- Sidebar -->
      <aside id="sidebar" class="glass-panel" style="width: 320px; z-index: 1000; display: flex; flex-direction: column; margin: 16px; position: absolute; left: 0; top: 0; bottom: 0; transition: transform 0.3s;">
        <div style="padding: 24px; border-bottom: 1px solid var(--border-ui);">
          <h1 style="font-size: 24px; margin-bottom: 8px;">UJ3DMap</h1>
          <p style="color: var(--text-secondary); font-size: 14px;">Offline Map & Router</p>
        </div>
        
        <nav style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
          <button id="nav-map" class="btn-primary" style="width: 100%; justify-content: flex-start;">Map View</button>
          <button id="nav-gallery" class="btn-secondary" style="width: 100%; justify-content: flex-start;">Video Gallery</button>
          <button id="nav-admin" class="btn-secondary" style="width: 100%; justify-content: flex-start;">Admin</button>
        </nav>
        
        <div style="padding: 16px; border-top: 1px solid var(--border-ui); display: flex; flex-direction: column; gap: 12px;">
          <button id="toggle-theme" class="btn-secondary" style="width: 100%; justify-content: center;">Night Mode</button>
        </div>
      </aside>

      <!-- Main Map -->
      <main id="map" style="flex: 1; height: 100%; width: 100%;"></main>

      <!-- Search Overlay -->
      <div id="search-box" class="glass-panel" style="position: absolute; top: 16px; right: 16px; width: 350px; z-index: 1000; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
        <input type="text" id="search-input" placeholder="Search POIs, Faculties..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-ui); background: var(--bg-input); color: var(--text-primary); outline: none;" />
        
        <div style="display: flex; gap: 8px; justify-content: space-between;">
          <button id="mode-walk" class="btn-primary" style="flex: 1; justify-content: center; font-size: 13px;">Walk</button>
          <button id="mode-bike" class="btn-secondary" style="flex: 1; justify-content: center; font-size: 13px;">Bike</button>
          <button id="mode-drive" class="btn-secondary" style="flex: 1; justify-content: center; font-size: 13px;">Drive</button>
        </div>
      </div>
      
      <!-- Admin / Auth Overlay -->
      <div id="admin-overlay" class="glass-panel" style="display: none; position: absolute; inset: 0; z-index: 2000; background: rgba(15, 23, 42, 0.9); justify-content: center; align-items: center;">
        <div style="background: var(--bg-panel); padding: 32px; border-radius: 16px; border: 1px solid var(--border-ui); width: 400px; max-width: 90%; position: relative;">
          <button id="close-admin" style="position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--text-secondary); cursor: pointer;">✕</button>
          
          <!-- Login Form -->
          <div id="admin-login-form" style="display: flex; flex-direction: column; gap: 16px;">
            <h2>Admin Login</h2>
            <input type="email" id="login-email" placeholder="Email" style="padding: 12px; border-radius: 8px; border: 1px solid var(--border-ui); background: var(--bg-input); color: var(--text-primary);" />
            <input type="password" id="login-password" placeholder="Password" style="padding: 12px; border-radius: 8px; border: 1px solid var(--border-ui); background: var(--bg-input); color: var(--text-primary);" />
            <button id="login-submit" class="btn-primary" style="justify-content: center;">Sign In</button>
          </div>

          <!-- Dashboard -->
          <div id="admin-dashboard" style="display: none; flex-direction: column; gap: 16px;">
            <h2>Admin Dashboard</h2>
            <p style="color: var(--text-secondary); font-size: 14px;">Welcome back. You can upload GeoJSON or moderate content here.</p>
            
            <button class="btn-primary" style="justify-content: center;">Upload GeoJSON Maps</button>
            <button class="btn-secondary" style="justify-content: center;">Manage Heatmaps</button>
            
            <hr style="border-color: var(--border-ui); margin: 16px 0;" />
            <button id="admin-logout" class="btn-secondary" style="justify-content: center; color: #ef4444; border-color: #ef4444;">Sign Out</button>
          </div>
        </div>
      </div>
      
    </div>

  </body>
</html>
